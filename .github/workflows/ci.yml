name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0 # same as local; .golangci.yml also lints test/integration
      - name: swag spec is up to date
        run: |
          make swag
          changed=$(git status --porcelain -- docs/ internal/)
          test -z "$changed" || { echo "$changed"; echo "::error::run make swag and commit the result"; exit 1; }

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # Unit and integration tests together, with coverage merged across them and the compiled binary.
  # make coverage fails when the total is below 90%.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Starts postgres-test from docker-compose.yml and runs the tests against it, as locally.
      - run: make coverage
      - if: always()
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
      - if: always()
        run: make test-db-down
