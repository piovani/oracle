services:
  postgres:
    image: postgres:16-alpine
    container_name: oracle_postgres
    environment:
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: oracle
      POSTGRES_DB: oracle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Database for the integration tests, apart from the one above so tests never touch synced data.
  # It is not started by `docker compose up`; `make test-integration` starts it.
  # Data lives in memory and durability is off: it is thrown away anyway, and tests run faster.
  postgres-test:
    image: postgres:16-alpine
    container_name: oracle_postgres_test
    profiles: [test]
    environment:
      POSTGRES_USER: oracle_test
      POSTGRES_PASSWORD: oracle_test
      POSTGRES_DB: oracle_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle_test -d oracle_test"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
