basePath: /
definitions:
  Analysis:
    properties:
      as_of:
        description: last session analyzed, YYYY-MM-DD
        example: "2026-10-30"
        type: string
      avg_return:
        description: mean return per trade, net of costs (0.01 = 1%)
        example: 0.0123
        type: number
      eligible:
        description: signal, at least min_trades trades and positive expectancy
        example: true
        type: boolean
      expectancy:
        description: return per trade shrunk toward 0 for short records; ranks recommend
        example: 0.0067
        type: number
      levels:
        allOf:
        - $ref: '#/definitions/Levels'
        description: order prices for the next session, null without a signal
      name:
        example: PETROBRAS
        type: string
      signal:
        description: the rule fires on the as_of close
        example: true
        type: boolean
      ticker:
        example: PETR4
        type: string
      tier:
        example: forte
        type: string
      trades:
        description: trades in the track record
        example: 12
        type: integer
      win_rate:
        description: wins / trades, 0 to 1
        example: 0.75
        type: number
      wins:
        example: 9
        type: integer
    type: object
  Error:
    properties:
      error:
        example: ticker ZZZZ3 not found
        type: string
    type: object
  HealthResponse:
    properties:
      status:
        description: always "ok"
        example: ok
        type: string
      time:
        description: current server time, UTC, RFC 3339
        example: "2026-11-01T22:07:11Z"
        type: string
    type: object
  Levels:
    properties:
      close:
        description: signal close, BRL
        example: 38.2
        type: number
      max_entry:
        description: limit buy price for the next session, BRL
        example: 37.71
        type: number
      stop:
        description: BRL
        example: 36.24
        type: number
      target:
        description: BRL
        example: 39.18
        type: number
    type: object
  Quote:
    properties:
      average:
        description: BRL, volume-weighted
        example: 38.1
        type: number
      close:
        description: BRL
        example: 38.2
        type: number
      date:
        description: YYYY-MM-DD
        example: "2026-10-30"
        type: string
      high:
        description: BRL
        example: 38.45
        type: number
      low:
        description: BRL
        example: 37.62
        type: number
      name:
        example: PETROBRAS
        type: string
      open:
        description: BRL
        example: 37.9
        type: number
      quantity:
        example: 41250300
        type: integer
      ticker:
        example: PETR4
        type: string
      trades:
        description: number of trades
        example: 52310
        type: integer
      volume:
        description: BRL
        example: 1.5716324305e+09
        type: number
    type: object
  Session:
    properties:
      date:
        description: YYYY-MM-DD
        example: "2026-10-30"
        type: string
      stale:
        description: 'more than 4 days old: a sync is missing'
        example: false
        type: boolean
    type: object
  Signals:
    properties:
      rule:
        example: RSI(2) < 10
        type: string
      session:
        description: latest session, YYYY-MM-DD
        example: "2026-10-30"
        type: string
      signals:
        description: eligible first, then by expectancy
        items:
          $ref: '#/definitions/Analysis'
        type: array
      tier:
        example: forte
        type: string
    type: object
  Strategy:
    properties:
      cost_pct:
        description: cost per side, in percent
        example: 0.03
        type: number
      entry_atr:
        description: limit buy this many ATRs below the signal close
        example: 0.5
        type: number
      max_hold:
        description: sessions before selling at the close
        example: 5
        type: integer
      min_trades:
        description: trades in the track record to be eligible
        example: 5
        type: integer
      min_volume:
        description: median daily volume in BRL over 60 sessions
        example: 5000000
        type: number
      oversold:
        description: RSI(2) below this is a signal, in the strongest tier
        example: 10
        type: number
      stop_atr:
        description: stop this many ATRs below the signal close
        example: 2
        type: number
      target_atr:
        description: sell this many ATRs above the signal close
        example: 1
        type: number
      warmup:
        description: sessions before the first signal (the SMA200)
        example: 200
        type: integer
    type: object
  Ticker:
    properties:
      first_session:
        description: first day with a quote, YYYY-MM-DD
        example: "2020-01-02"
        type: string
      isin:
        description: ISIN of the latest quote
        example: BRPETRACNPR6
        type: string
      last_session:
        description: last day with a quote, YYYY-MM-DD
        example: "2026-10-30"
        type: string
      name:
        description: company name as B3 abbreviates it
        example: PETROBRAS
        type: string
      sessions:
        description: days with a quote
        example: 1700
        type: integer
      spec:
        description: 'share type and listing segment: ON, PN, UNT for stocks; CI,
          DRN... for funds, ETFs and BDRs'
        example: PN N2
        type: string
      ticker:
        example: PETR4
        type: string
    type: object
  TickerDetail:
    properties:
      first_session:
        description: first day with a quote, YYYY-MM-DD
        example: "2020-01-02"
        type: string
      isin:
        description: ISIN of the latest quote
        example: BRPETRACNPR6
        type: string
      last_quote:
        $ref: '#/definitions/Quote'
      last_session:
        description: last day with a quote, YYYY-MM-DD
        example: "2026-10-30"
        type: string
      name:
        description: company name as B3 abbreviates it
        example: PETROBRAS
        type: string
      sessions:
        description: days with a quote
        example: 1700
        type: integer
      spec:
        description: 'share type and listing segment: ON, PN, UNT for stocks; CI,
          DRN... for funds, ETFs and BDRs'
        example: PN N2
        type: string
      ticker:
        example: PETR4
        type: string
    type: object
  Tier:
    properties:
      label:
        example: forte
        type: string
      oversold:
        description: RSI(2) must be below this; 101 means no pullback is required
        example: 10
        type: number
      rule:
        example: RSI(2) < 10
        type: string
    type: object
  Trade:
    properties:
      entry:
        description: BRL
        example: 35.1
        type: number
      entry_date:
        description: session the limit order filled
        example: "2026-03-13"
        type: string
      exit:
        description: BRL
        example: 35.92
        type: number
      exit_date:
        example: "2026-03-17"
        type: string
      return:
        description: net of costs (0.01 = 1%)
        example: 0.0228
        type: number
      signal_date:
        description: close the plan was made after
        example: "2026-03-12"
        type: string
    type: object
info:
  contact: {}
  description: |-
    HTTP API of the oracle, started with `oracle api`.
    The server listens on `PORT` (default 8080) and connects to Postgres before it starts listening: if the database is unreachable, the process exits and nothing answers.
    There is no authentication. Routes that don't exist answer 404, and known routes called with the wrong method answer 405 with an `Allow` header, both in plain text.
  title: oracle API
  version: "1.0"
paths:
  /health:
    get:
      description: |-
        Reports that the server is up, with the current server time in UTC (RFC 3339).
        The database connection is checked once at startup, not on every call, so a 200 means the process is running and was able to connect when it started.
        No side effects; safe to call repeatedly, for example from a load balancer or monitor.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
        "405":
          description: 'Method Not Allowed: only GET and HEAD are accepted (Allow:
            GET, HEAD)'
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /sessions/{date}/quotes:
    get:
      description: Every quote of one trading day, of any spec, in ticker order.
      parameters:
      - description: Trading day (YYYY-MM-DD)
        example: "2026-10-30"
        in: path
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Quote'
            type: array
        "400":
          description: date is not a YYYY-MM-DD date
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: no session on that day (weekend, holiday or not synced)
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: List the quotes of a session
      tags:
      - quotes
  /sessions/latest:
    get:
      description: 'The last day with quotes in the database, and whether it is stale:
        older than 4 days, which means a sync is missing.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Session'
        "404":
          description: no quotes stored yet
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Get the latest session
      tags:
      - quotes
  /signals:
    get:
      description: |-
        Every stock traded on the latest session whose close fires the rule of the tier, with its order prices and track record: the candidates oracle recommend picks from, before analyst targets and position sizing.
        Eligible stocks come first, then by expectancy. An empty list means no signal in that tier.
      parameters:
      - description: Signal tier (default forte)
        enum:
        - forte
        - médio
        - fraco
        - tendência
        in: query
        name: tier
        type: string
      - description: Years of history (default 3, at most 30)
        in: query
        maximum: 30
        minimum: 1
        name: years
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Signals'
        "400":
          description: unknown tier or years out of range
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: no stock quotes stored in the period
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: List today's signals
      tags:
      - strategy
  /strategy:
    get:
      description: |-
        The parameters of the swing rule that oracle recommend and oracle backtest use. Prices are set from the ATR (average true range of 14 sessions) of the signal day.
        A signal is a close above the 200-day average with RSI(2) below oversold. The tiers lower the bar for oversold; see /strategy/tiers.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Strategy'
      summary: Get the strategy parameters
      tags:
      - strategy
  /strategy/tiers:
    get:
      description: |-
        The signal levels, from strongest to weakest. oracle recommend stops at the first that fills the list, or goes down the tiers with -fill.
        Labels are in Portuguese, as the CLI prints them; the tier query parameter also accepts them without accents (medio, tendencia).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Tier'
            type: array
      summary: List the signal tiers
      tags:
      - strategy
  /tickers:
    get:
      description: |-
        Every ticker with quotes in the database, of any spec (stocks, real estate funds, ETFs, BDRs), in ticker order.
        Name, spec and ISIN come from the latest quote of each ticker. An empty database answers an empty list.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Ticker'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: List tickers
      tags:
      - quotes
  /tickers/{ticker}:
    get:
      description: Summary of one ticker and its latest quote. The ticker is case-insensitive.
      parameters:
      - description: B3 ticker
        example: PETR4
        in: path
        name: ticker
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TickerDetail'
        "404":
          description: no quotes for the ticker
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Get a ticker
      tags:
      - quotes
  /tickers/{ticker}/analysis:
    get:
      description: |-
        Runs the rule on the last years of one stock, as oracle recommend does for every stock: whether there is a signal on its latest session, the order prices, and its track record.
        Only the part of the series after the last split counts. Without at least 260 sessions there, or with a median volume below min_volume, the track record is empty and there is no signal.
      parameters:
      - description: B3 ticker of a stock (ON, PN or UNT)
        example: PETR4
        in: path
        name: ticker
        required: true
        type: string
      - description: Signal tier (default forte)
        enum:
        - forte
        - médio
        - fraco
        - tendência
        in: query
        name: tier
        type: string
      - description: Years of history (default 3, at most 30)
        in: query
        maximum: 30
        minimum: 1
        name: years
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Analysis'
        "400":
          description: unknown tier or years out of range
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: no quotes for the ticker in the period
          schema:
            $ref: '#/definitions/Error'
        "422":
          description: the ticker is not a stock
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: Analyze a stock
      tags:
      - strategy
  /tickers/{ticker}/quotes:
    get:
      description: |-
        Daily quotes of one ticker, in date order. Prices are as traded, not adjusted for splits or dividends.
        Without from and to, the whole history is returned. A range without sessions answers an empty list.
      parameters:
      - description: B3 ticker
        example: PETR4
        in: path
        name: ticker
        required: true
        type: string
      - description: First day, included (YYYY-MM-DD)
        example: "2026-10-01"
        in: query
        name: from
        type: string
      - description: Last day, included (YYYY-MM-DD)
        example: "2026-10-30"
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Quote'
            type: array
        "400":
          description: from or to is not a YYYY-MM-DD date, or from is after to
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: no quotes for the ticker
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: List the quotes of a ticker
      tags:
      - quotes
  /tickers/{ticker}/trades:
    get:
      description: |-
        The trades behind the track record of /tickers/{ticker}/analysis, in date order: each signal is bought with a limit order the next session and sold at the target, the stop or the close of the last holding session.
        Empty when the series after the last split is too short or not liquid enough.
      parameters:
      - description: B3 ticker of a stock (ON, PN or UNT)
        example: PETR4
        in: path
        name: ticker
        required: true
        type: string
      - description: Signal tier (default forte)
        enum:
        - forte
        - médio
        - fraco
        - tendência
        in: query
        name: tier
        type: string
      - description: Years of history (default 3, at most 30)
        in: query
        maximum: 30
        minimum: 1
        name: years
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Trade'
            type: array
        "400":
          description: unknown tier or years out of range
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: no quotes for the ticker in the period
          schema:
            $ref: '#/definitions/Error'
        "422":
          description: the ticker is not a stock
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
      summary: List the simulated trades of a stock
      tags:
      - strategy
swagger: "2.0"
